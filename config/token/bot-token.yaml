kind: token
version: v2
metadata:
  name: gitlab-demo-token
spec:
  # The Bot role indicates that this token grants access to a bot user, rather
  # than allowing a node to join. This role is built in to Teleport.
  roles: [Bot]
  join_method: gitlab
  # The bot user this token grants access to. This should match the name
  # of an existing bot.
  bot_name: gitlab:example.com
  gitlab:
    # The domain of a GitLab instance. Omit this field for gitlab.com repos.
    domain: git.example.com
    # Rules that control which GitLab tokens will be accepted by Teleport.
    # Tokens not matching any allow rule will be denied.
    allow:
      # The fully qualified path of a GitLab project.
      - project_path: devops/teleport

